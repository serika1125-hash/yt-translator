<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube 한글 자막 번역기</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 20px 40px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header .logo {
      width: 36px;
      height: 36px;
      background: #ff0000;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    header span {
      font-size: 13px;
      color: #888;
      margin-left: 4px;
    }

    main {
      width: 100%;
      max-width: 800px;
      padding: 48px 24px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h2 {
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
    }

    .hero h2 span {
      color: #ff4444;
    }

    .hero p {
      margin-top: 12px;
      color: #999;
      font-size: 15px;
    }

    .input-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 28px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 15px;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]::placeholder { color: #555; }
    input[type="text"]:focus { border-color: #ff4444; }

    button#translateBtn {
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button#translateBtn:hover { background: #cc0000; }
    button#translateBtn:active { transform: scale(0.97); }
    button#translateBtn:disabled { background: #444; cursor: not-allowed; }

    .api-row {
      margin-top: 16px;
    }

    .api-row label {
      font-size: 12px;
      color: #666;
      display: block;
      margin-bottom: 6px;
    }

    .api-row-inner {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="password"] {
      flex: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="password"]::placeholder { color: #555; }
    input[type="password"]:focus { border-color: #ff4444; }

    .toggle-pw {
      background: none;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 12px;
      color: #777;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.2s, color 0.2s;
    }
    .toggle-pw:hover { border-color: #555; color: #ccc; }

    /* 상태 표시 */
    #status {
      display: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 28px;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #ff4444;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #statusText {
      color: #aaa;
      font-size: 14px;
    }

    /* 결과 카드 */
    #result {
      display: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 28px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      gap: 12px;
    }

    .result-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      line-height: 1.4;
    }

    .result-meta {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .copy-btn {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      padding: 8px 14px;
      color: #ccc;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .copy-btn:hover { background: #333; }
    .copy-btn.copied { background: #1a3a1a; border-color: #2a5a2a; color: #6adf6a; }

    .divider {
      height: 1px;
      background: #262626;
      margin-bottom: 20px;
    }

    .translated-content {
      color: #d8d8d8;
      font-size: 15px;
      line-height: 1.85;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    /* 에러 */
    #error {
      display: none;
      background: #1f1010;
      border: 1px solid #4a1a1a;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 20px;
      color: #ff8080;
      font-size: 14px;
    }

    .how-to {
      margin-top: 40px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px 28px;
    }

    .how-to h3 {
      font-size: 14px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .step-num {
      width: 24px;
      height: 24px;
      background: #ff0000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-text {
      font-size: 14px;
      color: #aaa;
      line-height: 1.5;
    }

    .step-text strong { color: #ccc; }

    a { color: #ff6666; text-decoration: none; }
    a:hover { text-decoration: underline; }

    footer {
      margin-top: auto;
      padding: 24px;
      color: #555;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">▶</div>
  <h1>YouTube 한글 번역기</h1>
  <span>자막 자동 번역</span>
</header>

<main>
  <div class="hero">
    <h2>유튜브 영상을<br /><span>완벽한 한국어</span>로 번역</h2>
    <p>YouTube 링크를 붙여넣으면 자막을 추출해 한글로 번역해드립니다</p>
  </div>

  <div class="input-card">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://www.youtube.com/watch?v=..." />
      <button id="translateBtn" onclick="doTranslate()">번역하기</button>
    </div>
    <div class="api-row">
      <label>🔑 백엔드 서버 URL (Railway 배포 후 입력)</label>
      <div class="api-row-inner">
        <input type="password" id="serverUrl" placeholder="https://your-app.railway.app" />
        <button class="toggle-pw" onclick="togglePw()">보기</button>
      </div>
    </div>
  </div>

  <div id="error"></div>

  <div id="status">
    <div class="spinner"></div>
    <div id="statusText">자막을 추출하는 중...</div>
  </div>

  <div id="result">
    <div class="result-header">
      <div>
        <div class="result-title" id="resultTitle"></div>
        <div class="result-meta" id="resultMeta"></div>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyText()">📋 복사</button>
    </div>
    <div class="divider"></div>
    <div class="translated-content" id="translatedText"></div>
  </div>

  <div class="how-to">
    <h3>사용 방법</h3>
    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text"><strong>백엔드 서버 배포</strong> — Railway에 서버를 배포하고 URL을 위에 입력하세요 (최초 1회)</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text"><strong>YouTube URL 붙여넣기</strong> — 번역할 영상 링크를 입력창에 넣으세요</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text"><strong>번역하기 클릭</strong> — 자막이 자동 추출되어 한국어로 번역됩니다</div>
      </div>
    </div>
  </div>
</main>

<footer>
  Claude API로 번역 · yt-dlp로 자막 추출 · 자막이 없는 영상은 번역 불가
</footer>

<script>
  function togglePw() {
    const el = document.getElementById('serverUrl');
    const btn = document.querySelector('.toggle-pw');
    if (el.type === 'password') {
      el.type = 'text';
      btn.textContent = '숨기기';
    } else {
      el.type = 'password';
      btn.textContent = '보기';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = '⚠️ ' + msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('error').style.display = 'none';
  }

  function setStatus(text) {
    document.getElementById('statusText').textContent = text;
    document.getElementById('status').style.display = 'block';
    document.getElementById('result').style.display = 'none';
  }

  function hideStatus() {
    document.getElementById('status').style.display = 'none';
  }

  async function doTranslate() {
    const url = document.getElementById('urlInput').value.trim();
    const serverUrl = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
    const btn = document.getElementById('translateBtn');

    hideError();

    if (!url) {
      showError('YouTube URL을 입력해주세요.');
      return;
    }

    if (!serverUrl) {
      showError('백엔드 서버 URL을 입력해주세요. (Railway 배포 후 입력)');
      return;
    }

    if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
      showError('올바른 YouTube URL을 입력해주세요.');
      return;
    }

    btn.disabled = true;
    setStatus('🔍 YouTube 자막을 추출하는 중...');

    try {
      const res = await fetch(`${serverUrl}/translate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url }),
      });

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || `서버 오류 (${res.status})`);
      }

      setStatus('✨ Claude AI가 한글로 번역 중...');

      const data = await res.json();

      hideStatus();
      document.getElementById('result').style.display = 'block';
      document.getElementById('resultTitle').textContent = data.title || '번역 완료';
      document.getElementById('resultMeta').textContent =
        `원본 언어: ${data.original_language || '감지됨'} · 원문 ${data.character_count?.toLocaleString() || '-'}자`;
      document.getElementById('translatedText').textContent = data.translated_text;

    } catch (err) {
      hideStatus();
      showError(err.message || '번역 중 오류가 발생했습니다. 다시 시도해주세요.');
    } finally {
      btn.disabled = false;
    }
  }

  function copyText() {
    const text = document.getElementById('translatedText').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ 복사됨';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 복사';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  // Enter 키로 번역
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doTranslate();
    });

    // 로컬 스토리지에서 서버 URL 복원
    const saved = localStorage.getItem('ytTranslatorServer');
    if (saved) document.getElementById('serverUrl').value = saved;

    // 서버 URL 변경 시 저장
    document.getElementById('serverUrl').addEventListener('change', e => {
      localStorage.setItem('ytTranslatorServer', e.target.value);
    });
  });
</script>

</body>
</html>
